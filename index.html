<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Trim — a local-first wizard that walks you through calibrating a filament profile for Orca Slicer or Bambu Studio, on single-nozzle, dual-nozzle and multi-nozzle printers. No account, no uploads, everything stays on your device." />
  <title>Trim — Filament Calibration</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0B0D0F" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#E7E4DC" media="(prefers-color-scheme: light)" />
</head>
<body>
  <!--
  DIRECTION CONTRACT
  THESIS: Calibration steers a printer into agreement with reality; aviation is where precision instruments decide outcomes.
  OWN-WORLD: Night Instrument Panel — a small aircraft's luminous six-pack, holding trust through cloud when nothing is outside the glass.
  STORY: An unlit gauge means not yet measured. Values land, needles settle, and the panel lights one instrument at a time until the machine is trimmed.
  FIRST VIEWPORT: Matte black panel, brushed hairline bezels, a ranked row of round gauges with bordered placards beneath; radio-green needles on measured values, dark faces on uncalibrated ones.
  FORM: Night instrument six-pack. A dealt challenger that beat the assigned grounded direction (grounded #6 was a statistical process-control chart). Seed key 0e8d3a49.
  -->
  <div id="app">
    <main class="boot-panel" style="max-width:44rem;margin:3rem auto;padding:1.5rem;color:#F2F5F2;background:#111417;border:1px solid #333B42;border-top:2px solid #39FF9A;border-radius:4px;font-family:Bahnschrift,'DIN Alternate','Roboto Condensed','Segoe UI',system-ui,sans-serif">
      <h1 style="margin:0 0 .7rem;padding-bottom:.7rem;border-bottom:1px solid rgba(242,245,242,.13);font-size:1.05rem;text-transform:uppercase;letter-spacing:.1em;color:#39FF9A">Instruments powering up…</h1>
      <p style="margin:.45rem 0;max-width:68ch;color:#8B9A93;line-height:1.55">Trim is starting. If this panel stays on screen, the app bundle did not load — reinstall from the latest release or report a startup issue.</p>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
