name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact-name: perfectfit-macos
            args: '--target universal-apple-darwin --bundles dmg'
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          - platform: windows-latest
            artifact-name: perfectfit-windows
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      # Every action below is pinned to a commit SHA, not a moving tag: a tag
      # can be repointed at any time, and these actions run with write access
      # to the release and produce the binaries users install.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Pinned rather than lts/*, so the toolchain that builds a release is
          # the one it was tested with instead of whatever is LTS that week.
          node-version: '22'
          cache: npm

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # The action is pinned; the toolchain it installs is still the current
      # stable release, which is what Cargo.toml's rust-version floor expects.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # No Rust build cache here on purpose. A release binary is something
      # people run on their own machines; it is built from source every time
      # rather than linked against object files restored from a mutable,
      # branch-writable cache whose contents nothing in this workflow verifies.

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate printer database is up to date
        run: npm run validate:printers

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PerfectFit X2D ${{ github.ref_name }}'
          releaseBody: |
            # PerfectFit X2D 2.0.0

            A fork of [PerfectFit](https://github.com/tayloraaron078-tech/Filament_Calibration_Wizard)
            focused on **dual-nozzle printers** — in particular the Bambu Lab X2D, whose
            auxiliary nozzle is bowden-fed and receives no automatic flow-dynamics
            calibration from the printer.

            ## ⚠ Read first if you already have PerfectFit installed

            This build carries its own application identity — `PerfectFit X2D`,
            identifier `io.github.espentruls.perfectfit-x2d` — instead of upstream's
            `com.redeemed3d.perfectfit`. It therefore installs **alongside** upstream
            PerfectFit rather than on top of it, and no longer shares upstream's data
            store (previously both wrote to the same one, so upstream's "erase all data"
            erased this app's projects too).

            **Your calibration data does not move by itself.** Nothing is deleted — the
            old data stays on disk — but this build starts empty. Before you install it:

            1. In your existing build: **Settings → ⭳ Export all data + photos**, keep the JSON file.
            2. Install this version.
            3. **Settings → 📥 Restore from backup** and pick that file.

            Slicer preset backups (Settings → "Slicer profile backups") are stored under
            the old identity too — on Windows in
            `%APPDATA%\com.redeemed3d.perfectfit\slicer-backups`. Restore anything you
            still need from the old build before uninstalling it, or copy that folder to
            `%APPDATA%\io.github.espentruls.perfectfit-x2d\slicer-backups` afterwards.
            The browser/Docker deployment is unaffected: its data is keyed to the site
            origin, not to the desktop identifier.

            ## Downloads

            - **Windows: `.exe` NSIS installer** — download, run, done.
            - macOS: universal `.dmg` (Apple Silicon + Intel).
            - Linux: `.deb` and portable `.AppImage`.

            ## What this fork adds

            - **Dual-nozzle printer profiles.** A printer has nozzles, each with its own
              feed path. A Bambu Lab X2D quick-fill sets up both: main direct-drive, and
              auxiliary bowden with its real speed and acceleration limits.
            - **Per-nozzle calibration projects.** A project states which nozzle it
              calibrates, and suggested ranges follow the feed path — a bowden auxiliary
              nozzle gets a pressure-advance range roughly ten times a direct-drive
              nozzle's, and retraction suggestions to match.
            - **A guided calibration session.** One screen per test: the exact settings to
              change, then print and measure. Results carry forward, so the pressure-advance
              test runs at the temperature and flow ratio already measured. A material
              default never satisfies a dependency, so a test cannot quietly run on a
              generic value. Every pre-filled number shows where it came from.
            - **An ooze-control step** for the idle-nozzle drool that only dual-nozzle
              machines have, covering prime tower, ramming and pre-cool, and the
              standby-temperature cycle behind it.
            - **Bambu-specific guidance, per nozzle.** The Setting Overrides column, the
              BambuStudio #10404 trap where an unset bowden override silently falls back to
              the main nozzle's retraction, and the fact that pressure-advance K is stored
              on the printer keyed to filament and nozzle — and only applies with the
              pre-print calibration setting off.
            - **A rebuilt interface** in a night instrument-panel language: an unmeasured
              value shows an unlit dial rather than a fake zero, amber and red are reserved
              for real caution, and the printable calibration card inverts to clean
              ink-on-white for the sheet you carry to the machine.

            ## Fixes carried over from the review of upstream 1.1.3

            Ten verified defects, including one that blocked profile install and export for
            every Bambu and stock base preset, per-extruder values leaking onto the wrong
            nozzle, and temperature ranges collapsing to zero width on temperature-limited
            printers.

            ## Honest limitations

            - Automated test *preparation* drives OrcaSlicer only — upstream treats Bambu
              Studio as a manual handoff by design. For Bambu users the automation that
              matters is preset installation, which writes calibrated values into a filament
              preset per nozzle.
            - The app never talks to your printer and never starts a print.
            - Linux and macOS slicer detection are less exercised than Windows.

            Licensed AGPL-3.0, like the upstream project.
          # Stays a DRAFT until every platform has built and the Windows
          # installer is actually attached (see the `publish` job). A public
          # release that appears the moment the first runner finishes offers
          # downloads that do not exist yet, and stays public advertising them
          # if a later build fails.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    # `needs` requires EVERY matrix job to have succeeded, which fail-fast:false
    # does not change — it only stops one failure from cancelling the others.
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Publish the draft only once the Windows installer is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "Assets attached to $TAG:"
          echo "$assets"
          if ! printf '%s\n' "$assets" | grep -qiE '\.exe$'; then
            echo "::error::No Windows .exe installer is attached to $TAG. Leaving the release as a draft."
            exit 1
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          echo "Published $TAG."
