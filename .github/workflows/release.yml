name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact-name: trim-macos
            args: '--target universal-apple-darwin --bundles dmg'
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          - platform: windows-latest
            artifact-name: trim-windows
            args: '--bundles nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      # Every action below is pinned to a commit SHA, not a moving tag: a tag
      # can be repointed at any time, and these actions run with write access
      # to the release and produce the binaries users install.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Pinned rather than lts/*, so the toolchain that builds a release is
          # the one it was tested with instead of whatever is LTS that week.
          node-version: '22'
          cache: npm

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # The action is pinned; the toolchain it installs is still the current
      # stable release, which is what Cargo.toml's rust-version floor expects.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # No Rust build cache here on purpose. A release binary is something
      # people run on their own machines; it is built from source every time
      # rather than linked against object files restored from a mutable,
      # branch-writable cache whose contents nothing in this workflow verifies.

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate printer database is up to date
        run: npm run validate:printers

      # Five places state the version: package.json, src-tauri/Cargo.toml,
      # src-tauri/tauri.conf.json, the top entry of CHANGELOG.md, and the tag
      # being released. An installer that reports one number while its notes and
      # changelog report another is a release nobody can reason about — and the
      # notes below are generated from the tag for the same reason. They are
      # checked to agree here instead of being kept in step by hand.
      - name: Check the version agrees everywhere
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          chg=$(sed -n 's/^## \([0-9][0-9A-Za-z.+-]*\).*/\1/p' CHANGELOG.md | head -1)
          tag="${REF_NAME#v}"
          echo "package.json      $pkg"
          echo "tauri.conf.json   $conf"
          echo "Cargo.toml        $cargo"
          echo "CHANGELOG.md      $chg"
          echo "tag               $tag (ref_type=$REF_TYPE)"
          ok=1
          for v in "$conf" "$cargo" "$chg"; do
            [ -n "$v" ] && [ "$v" = "$pkg" ] || ok=0
          done
          if [ "$REF_TYPE" = "tag" ] && [ "$tag" != "$pkg" ]; then ok=0; fi
          if [ "$ok" -ne 1 ]; then
            echo "::error::Version mismatch. package.json, src-tauri/Cargo.toml, src-tauri/tauri.conf.json, the top CHANGELOG.md entry and the release tag must all state the same version."
            exit 1
          fi
          echo "All five agree on $pkg."

      # The check above covers the five places that state the version as a
      # version. Two docs also state it INSIDE an installer filename, in a
      # command the reader is meant to copy: README.md's Linux/Wayland
      # workaround (`Trim_<version>_amd64.AppImage`) and "Install on Mac.md"'s
      # quarantine command (`Trim_<version>_universal.dmg`). Nothing generates
      # those, so they used to rot silently on the next bump and hand a reader a
      # command naming a file they do not have. Both now use a `<version>`
      # placeholder; this step fails if a literal version comes back and
      # disagrees with package.json. The filename stem is `productName` from
      # tauri.conf.json, which is what Tauri names the bundles after — it moved
      # from "PerfectFit X2D" to "Trim" in 3.0.0.
      - name: Check installer filenames in the docs have not gone stale
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          product=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          ok=1
          for f in README.md "Install on Mac.md"; do
            while IFS= read -r v; do
              [ -n "$v" ] || continue
              if [ "$v" = "$pkg" ]; then
                echo "$f names installer version $v (matches package.json)"
              else
                echo "::error file=$f::$f names an installer '${product}_${v}_...' but package.json says $pkg. Use the <version> placeholder, or update the filename."
                ok=0
              fi
            done < <(grep -oE "${product}_[0-9]+\.[0-9]+\.[0-9]+" "$f" | sed 's/^.*_//' | sort -u)
          done
          [ "$ok" -eq 1 ]
          echo "No stale installer filename in README.md or Install on Mac.md."

      # A release attaches installers people run on their own machines, and this
      # app writes into their slicer's real preset directory. Nothing may be
      # packaged before both suites have passed ON THIS PLATFORM: the Rust half
      # is where the file writing, the atomic replace and the backup live, and it
      # is the half whose behaviour differs most per OS.
      - name: Run the TypeScript test suite
        run: npm test

      - name: Run the Rust test suite
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Trim ${{ github.ref_name }}'
          releaseBody: |
            # Trim ${{ github.ref_name }}

            A fork of [PerfectFit](https://github.com/tayloraaron078-tech/Filament_Calibration_Wizard)
            that calibrates a filament profile for **single-nozzle, dual-nozzle and
            multi-nozzle printers**, one nozzle at a time. Per-nozzle calibration is what
            distinguishes it: a nozzle's feed path decides its ranges, so a bowden
            auxiliary is never handed direct-drive numbers.

            ## ⚠ This release renames the app

            Up to 2.0.0 this was **PerfectFit X2D**. It is now **Trim** — the X2D in the
            old name suggested one printer, and the app works with any of them. In
            aviation, trimming is adjusting the controls so the aircraft holds steady
            without constant correction, which is what calibrating a filament profile
            does.

            The rename also changes the application identity, from
            `io.github.espentruls.perfectfit-x2d` to `io.github.espentruls.trim`, which
            is the identity your operating system installs and stores data under.

            **This build starts fresh and does not carry anything over from 2.0.0.** It
            does not need to: 2.0.0 was published but never actually installed by
            anyone. If you are one of the people who did try it, nothing of yours is
            deleted — the two identities can coexist, so Trim installs **alongside**
            the old build rather than over it, and anything 2.0.0 wrote stays on disk
            under the old identifier. Use **Settings → ⭳ Export all data + photos** in
            the old build and **Settings → 📥 Restore from backup** in Trim if you want
            it here.

            The browser/Docker deployment is unaffected either way: its data is keyed to
            the site origin, not to the desktop identifier.

            ## Downloads

            - **Windows: `.exe` NSIS installer.**
            - macOS: universal `.dmg` (Apple Silicon + Intel).
            - Linux: `.deb` and portable `.AppImage`.

            **Read the next section before you run any of them** — none of these
            are signed, and your operating system will say so in alarming wording.

            ## ⚠ These installers are not signed

            There is no paid code-signing certificate behind this project, so the
            Windows `.exe` is **not code-signed** and the macOS `.dmg` is **not
            notarized**. Your operating system will say so, in wording that sounds
            like a malware detection. It is not one — it is the absence of a
            signature, and you should treat any unsigned download, this one included,
            as something you choose to trust rather than something vouched for.

            **Windows.** SmartScreen shows "Windows protected your PC" on every
            download. Click **More info**, then **Run anyway**. If the file is blocked
            outright: right-click the `.exe` → **Properties** → tick **Unblock** →
            **OK**, then run it.

            **macOS.** Gatekeeper may refuse the app, or report the `.dmg` itself as
            **"damaged and can't be opened"** — that message is what an un-notarized
            disk image looks like, not a corrupt download. After dragging the app to
            **Applications**: Control-click it → **Open** → **Open**. If that is
            refused, **System Settings → Privacy & Security → Open Anyway**. If the
            `.dmg` will not open at all, the quarantine flag has to be removed with a
            one-line `xattr` command — that command, what it does and does not do, and
            the full click-by-click steps with the exact dialogs are in
            [Install on Mac.md](https://github.com/espentruls/Trim/blob/main/Install%20on%20Mac.md).

            **Linux.** The `.AppImage` needs the execute bit: `chmod +x` it first.

            **If you would rather not rely on any of that**, build from source —
            `npm install && npm run tauri build` — and run a binary you produced
            yourself.

            Every asset here is built by the workflow in this repository, from the
            tagged commit, with both test suites (TypeScript and Rust) passing on
            each platform before anything is packaged.

            ## What this fork adds

            - **Per-nozzle printer profiles.** A printer has nozzles, each with its own
              feed path — one on a single-nozzle machine, two on a Bambu Lab X2D, more on
              an H2D or H2C. A quick-fill sets up an X2D's pair: main direct-drive, and
              auxiliary bowden with its real speed and acceleration limits. The H2D and
              H2C layouts are modelled from published specifications and have not been
              tested on the actual machines.
            - **Per-nozzle calibration projects.** A project states which nozzle it
              calibrates, and suggested ranges follow the feed path — a bowden auxiliary
              nozzle gets a pressure-advance range roughly ten times a direct-drive
              nozzle's, and retraction suggestions to match.
            - **A guided calibration session.** One screen per test: the exact settings to
              change, then print and measure. Results carry forward, so the pressure-advance
              test runs at the temperature and flow ratio already measured. A material
              default never satisfies a dependency, so a test cannot quietly run on a
              generic value. Every pre-filled number shows where it came from.
            - **An ooze-control step** for the idle-nozzle drool that only dual-nozzle
              machines have, covering prime tower, ramming and pre-cool, and the
              standby-temperature cycle behind it.
            - **Bambu-specific guidance, per nozzle.** The Setting Overrides column, the
              BambuStudio #10404 trap where an unset bowden override silently falls back to
              the main nozzle's retraction, and the fact that pressure-advance K is stored
              on the printer keyed to filament and nozzle — and only applies with the
              pre-print calibration setting off.
            - **A rebuilt interface** in a night instrument-panel language: an unmeasured
              value shows an unlit dial rather than a fake zero, amber and red are reserved
              for real caution, and the printable calibration card inverts to clean
              ink-on-white for the sheet you carry to the machine.

            ## Safety fixes

            Two adversarial audit rounds, aimed at "could this damage someone's property
            or lose their data". Every defect was reproduced as broken before being
            fixed, and proven fixed afterwards. The critical three: the preset **backup
            system destroyed its own backups** when several files were backed up inside
            the same second, leaving a replaced preset unrecoverable while reporting
            success; a value calibrated for **one** nozzle was written to **every** nozzle
            whenever the base preset did not already declare that key, invisibly — on a
            dual-nozzle Bambu that put the bowden auxiliary's pressure advance onto the
            direct-drive main nozzle; and first-layer nozzle temperature was never checked
            against the printer's maximum, so 500 °C into a 240 °C printer validated
            clean. Full list in
            [CHANGELOG.md](https://github.com/espentruls/Trim/blob/main/CHANGELOG.md).

            This is on top of the ten verified defects carried over from the review of
            upstream 1.1.3 — including one that blocked profile install and export for
            every Bambu and stock base preset, per-extruder values leaking onto the wrong
            nozzle, and temperature ranges collapsing to zero width on temperature-limited
            printers.

            ## Removed before release: the assisted "auto-prepare" path

            The path that would have configured and sliced each calibration test for you
            was **removed before release** — not merely switched off, and not left in the
            binary with no way to reach it. No screen offers it, and the code that served
            it is gone: the eight desktop commands behind it are no longer registered, and
            the Rust and TypeScript modules implementing them are deleted rather than left
            unreferenced. That second half matters, because a registered command is
            callable from inside the app's webview whether or not a screen links to it —
            and these ones assembled slicer projects and merged calibrated values into a
            project configuration with no printer-limit and no plausibility check.
            Deleting them removes the feature and the surface together.

            It went rather than being finished because it could never have appeared on a
            dual-nozzle printer at all, it reached one of ten steps, it drove OrcaSlicer
            only — and it assembled the plate from the slicer's own template, so its
            g-code described the template's machine rather than yours. The guided session
            tells you exactly what to change and where; you make the change.

            ## Honest limitations

            - The app never talks to your printer and never starts a print, and it does not
              prepare or slice the test prints for you.
            - Preset installation is the automation that ships: it writes calibrated values
              into a filament preset, per nozzle, into your slicer's user preset directory —
              backing up the affected files first, refusing to run while the slicer is open,
              and never replacing an existing preset without explicit confirmation. It can
              be turned off in **Settings → Experimental features**.
            - Preset formats are version-volatile, so direct install is enabled only for
              slicer versions verified for it.
            - Linux and macOS slicer detection are less exercised than Windows.
            - This release adds a Content-Security-Policy to the desktop window. It was
              verified on Windows (WebView2) by launching the packaged build; the macOS
              and Linux packages ship it unverified on WebKit. If the window opens blank
              or the navigation icons are missing on those platforms, that is the likely
              cause and it is worth an issue.

            Licensed AGPL-3.0, like the upstream project.
          # Stays a DRAFT until every platform has built and the Windows
          # installer is actually attached (see the `publish` job). A public
          # release that appears the moment the first runner finishes offers
          # downloads that do not exist yet, and stays public advertising them
          # if a later build fails.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    # `needs` requires EVERY matrix job to have succeeded, which fail-fast:false
    # does not change — it only stops one failure from cancelling the others.
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Publish the draft only once the Windows installer is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          echo "Assets attached to $TAG:"
          echo "$assets"
          if ! printf '%s\n' "$assets" | grep -qiE '\.exe$'; then
            echo "::error::No Windows .exe installer is attached to $TAG. Leaving the release as a draft."
            exit 1
          fi
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          echo "Published $TAG."
