[package]
name = "app"
version = "2.0.0"
description = "PerfectFit X2D — Filament Calibration Wizard"
# This fork's maintainer ships the binary; upstream PerfectFit (Aaron Taylor) is
# credited in README.md, CHANGELOG.md and the AGPL-3.0 notice, which is where the
# licence attribution belongs.
authors = ["espentruls"]
license = "AGPL-3.0-only"
repository = "https://github.com/espentruls/Filament_Calibration_Wizard"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
sha2 = "0.10"
